<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div id="calculator">
        <div id="display">
            <p>Calculator</p>
            <div id="output">0</div>
        </div>
        <div id="keyboard">
            <button id="AC" class="lightGray">AC</button>
            <button id="changePolarity" class="lightGray">+/-</button>
            <button id="percent" class="lightGray">%</button>
            <button id="divide" class="orange">/</button>
            <button id="seven" class="darkGray">7</button>
            <button id="eight" class="darkGray">8</button>
            <button id="nine" class="darkGray">9</button>
            <button id="multiply" class="orange">*</button>
            <button id="four" class="darkGray">4</button>
            <button id="five" class="darkGray">5</button>
            <button id="six" class="darkGray">6</button>
            <button id="subtract" class="orange">-</button>
            <button id="one" class="darkGray">1</button>
            <button id="two" class="darkGray">2</button>
            <button id="three" class="darkGray">3</button>
            <button id="add" class="orange">+</button>
            <button id="calc" class="darkGray">Calc</button>
            <button id="zero" class="darkGray">0</button>
            <button id="decimal" class="darkGray">.</button>
            <button id="equals" class="orange">=</button>

        </div>
    </div>
</body>
</html>
